name: CI

on:
  push:
    branches: [main, feat/native-keeper-journal, feat/native-device-registry, feat/native-rekey-preflight, feat/native-host-controls, feat/native-rekey-interruption, feat/native-host-status, feat/native-member-controls, feat/native-retirement-store, feat/native-invitation-controls, feat/native-pending-recovery, feat/native-retirement-restart, feat/native-retirement-refusal, feat/native-invitation-replacement, feat/native-invitation-generation-storage, feat/native-invitation-replacement-restart, feat/native-invitation-sharing-read, feat/native-replacement-restart-index-digest, feat/native-replacement-pending-store-refusal, feat/native-pending-store-admission-integration, feat/native-link-route-read, feat/native-keeper-rekey-echo, feat/native-replacement-capacity, feat/native-pending-proof-report, feat/native-receiver-key-observation, feat/native-receiver-main-integration, feat/native-guest-preview-gate, feat/native-receiver-observer-variants, feat/native-replacement-archive, feat/native-replacement-envelope, feat/native-missing-index, feat/native-receiver-caller-bound, feat/native-atomic-file-overlap, feat/native-atomic-file-overlap-reporting, feat/native-replacement-spend-records, feat/native-active-spend-records, feat/native-hybrid-main-integration, feat/native-hybrid-logo-editor, feat/native-hybrid-project-logo, feat/native-atomic-file-serialization, feat/native-hybrid-current-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties

      - name: Install the Android build SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prepare the reviewed ForgeSworn Link bridge
        run: |
          scripts/fetch-link-bridge.sh build/link-ffi-android.zip
          python3 scripts/prepare-link-bridge.py build/link-ffi-android.zip

      - name: Prepare the reviewed VMLS engine bundle
        run: |
          scripts/fetch-vmls-ffi.sh build/vmls-ffi-android.zip
          python3 scripts/prepare-vmls-ffi.py build/vmls-ffi-android.zip

      - name: Prepare the pinned native BLE engine
        run: |
          python3 scripts/prepare-mesh-radio.py

      - name: Check out the pinned browser recording implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: forgesworn/kithmoot
          # Reviewed delayed-camera-answer candidate (web PR #407).
          ref: a185577b72040db186124333a50e40d45b950206
          path: build/browser-recording-reference
          persist-credentials: false

      - name: Use Node 24 for browser interoperability assets
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: build/browser-recording-reference/package-lock.json

      - name: Prepare actual browser Peer and recording Session assets
        run: |
          npm ci --prefix build/browser-recording-reference
          npm run build:context --prefix build/browser-recording-reference
          node scripts/prepare-browser-call-interop.mjs build/browser-recording-reference
          node scripts/prepare-browser-recording-interop.mjs build/browser-recording-reference

      - name: Install recording driver test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check release helper syntax
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py
          python3 scripts/check-recovery-runner.py
          python3 scripts/check-recording-capture-runner.py
          python3 scripts/check-sharing-restart-runner.py
          python3 scripts/check-native-pending-store-refusal-rows.py
          python3 scripts/check-native-pending-apk-inputs.py
          python3 scripts/test-pull-recovery-proof.py
          python3 scripts/test_recording_private_node_proxy.py
          python3 scripts/test_recording_failure_diagnostics.py

      - name: Verify independent nearby discovery vectors
        run: node scripts/check-nearby-discovery.mjs

      - name: Test and lint both variants
        run: ./gradlew :protocol:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:verifyNoDatatransportTelemetry --max-workers=2 --no-daemon --stacktrace

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-check-reports
          path: |
            protocol/build/reports/tests/
            protocol/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/interop/spry-account-android.json
          if-no-files-found: warn
          retention-days: 7

  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties

      - name: Install the Android build SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prepare the reviewed ForgeSworn Link bridge
        run: |
          scripts/fetch-link-bridge.sh build/link-ffi-android.zip
          python3 scripts/prepare-link-bridge.py build/link-ffi-android.zip

      - name: Prepare the reviewed VMLS engine bundle
        run: |
          scripts/fetch-vmls-ffi.sh build/vmls-ffi-android.zip
          python3 scripts/prepare-vmls-ffi.py build/vmls-ffi-android.zip

      - name: Prepare the pinned native BLE engine
        run: |
          python3 scripts/prepare-mesh-radio.py

      - name: Check out the pinned browser recording implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: forgesworn/kithmoot
          # Same reviewed browser implementation used by verify (web PR #407).
          ref: a185577b72040db186124333a50e40d45b950206
          path: build/browser-recording-reference
          persist-credentials: false

      - name: Use Node 24 for browser interoperability assets
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: build/browser-recording-reference/package-lock.json

      - name: Prepare actual browser Peer and recording Session assets
        run: |
          npm ci --prefix build/browser-recording-reference
          npm run build:context --prefix build/browser-recording-reference
          node scripts/prepare-browser-call-interop.mjs build/browser-recording-reference
          node scripts/prepare-browser-recording-interop.mjs build/browser-recording-reference

      - name: Build exact APK inputs from this workflow commit
        # Keep compression outside the test/lint heap and separate variants.
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 --no-daemon --stacktrace
          ./gradlew :app:assembleRelease --max-workers=2 --no-daemon --stacktrace

      - name: Verify Link and the VMLS engine are in both APKs
        run: |
          for variant in debug release; do
            apk="$(find "app/build/outputs/apk/$variant" -maxdepth 1 -name 'app-*.apk' -print -quit)"
            test -n "$apk"
            # Release ships arm64 only; x86_64 is for emulators.
            if [ "$variant" = release ]; then
              abis=arm64-v8a
              if unzip -Z1 "$apk" | grep -q '^lib/x86_64/'; then
                echo "error: the release APK carries x86_64 libraries" >&2
                exit 1
              fi
            else
              abis="arm64-v8a x86_64"
            fi
            for abi in $abis; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/liblink_ffi.so"
              # The VMLS engine ships in every build after vennel's D1 review
              # (an automated model review; see vennel
              # docs/gate/2026-10-07-d1-review.md), so both variants carry it.
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libvmls_ffi.so"
            done
            # The engine's Kotlin bindings too, not only its library (D1 R4).
            found=no
            for dex in $(unzip -Z1 "$apk" | grep '^classes[0-9]*\.dex$'); do
              if unzip -p "$apk" "$dex" | grep -aq 'Ldev/forgesworn/vmls/ffi/'; then found=yes; break; fi
            done
            if [ "$found" != yes ]; then
              echo "error: the $variant APK carries no VMLS engine bindings" >&2
              exit 1
            fi
          done

      - name: Rebuild the release with the emulator ABI for the lineage check
        # The signing-lineage job installs this APK on an x86_64 emulator. Only
        # packaging differs from the shipped arm64-only release.
        run: ./gradlew :app:assembleRelease -Pkithmoot.releaseEmulatorAbi=true --no-daemon --stacktrace

      - name: Keep exact signing-lineage APK inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signing-lineage-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1

      - name: Prepare exact pending-store APK inputs
        run: python3 scripts/prepare-native-pending-inputs.py prepare build/native-pending-store-apks

      - name: Keep exact pending-store APK inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-pending-store-apks
          path: build/native-pending-store-apks/
          if-no-files-found: error
          retention-days: 1

  recovery-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [ordinary, restarts]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android build SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Prepare the reviewed ForgeSworn Link bridge
        run: |
          scripts/fetch-link-bridge.sh build/link-ffi-android.zip
          python3 scripts/prepare-link-bridge.py build/link-ffi-android.zip

      - name: Prepare the reviewed VMLS engine bundle
        run: |
          scripts/fetch-vmls-ffi.sh build/vmls-ffi-android.zip
          python3 scripts/prepare-vmls-ffi.py build/vmls-ffi-android.zip

      - name: Prepare the pinned native BLE engine
        run: |
          python3 scripts/prepare-mesh-radio.py

      - name: Build the debug app and instrumentation APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify encrypted recovery and a forced process restart
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: kithmoot-recovery
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/check-recovery-matrix.sh '${{ matrix.suite }}'

      - name: Keep emulator reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: recovery-emulator-reports-${{ matrix.suite }}
          path: |
            app/build/reports/recovery-emulator/
            app/build/reports/sharing-restart-emulator/
            app/build/reports/room-logo-*-restart-emulator/
            app/build/reports/native-host-restart-emulator/
            app/build/reports/native-rekey-before-restart-emulator/
            app/build/reports/native-rekey-after-restart-emulator/
            app/build/reports/native-retirement-*-restart-emulator/
            app/build/reports/native-replacement-*-restart-emulator/
          if-no-files-found: warn
          retention-days: 7

  pending-store-refusal-emulator:
    name: pending-store-refusal-emulator (${{ matrix.window }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        window:
          - committed-source-before-offer
          - charged-original-before-offer
          - offered-before-index
          - index-committed-before-source-acknowledgement
          - reference-installed-before-subscription-switch
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android build SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Download the exact pending-store APK inputs from verify
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: native-pending-store-apks
          path: build/native-pending-store-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify pending replacement store refusals after process death
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SERIAL: emulator-5554
          PENDING_WINDOW: ${{ matrix.window }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: kithmoot-pending-${{ matrix.window }}
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/check-native-pending-store-shard.sh

      - name: Keep pending-store refusal reports and exact inputs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pending-store-refusal-${{ matrix.window }}
          path: |
            app/build/reports/native-pending-refusal-*-restart-emulator/
            build/native-pending-store-apks/inputs.json
          if-no-files-found: warn
          retention-days: 7

  recording-restart-emulator:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download exact recording APK inputs from verify
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: signing-lineage-apks
          path: app/build/outputs/apk
      - name: Install recording report tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Qualify recording Stop and Send across process restart
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            python3 scripts/check-recording-emulator-ready.py --adb "$ANDROID_HOME/platform-tools/adb" --serial "$ANDROID_SERIAL" --reports app/build/reports/native-recording-restart-launcher
            bash scripts/check-recording-stop-restart-emulator.sh
            bash scripts/check-recording-stop-ui-restart-emulator.sh
            KITHMOOT_RECORDING_SEND_RESTART=1 KITHMOOT_RECORDING_REPORTS=app/build/reports/native-recording-send-ui-restart bash scripts/check-recording-upload-send-emulator.sh
      - name: Keep recording restart reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: recording-restart-emulator-reports
          path: |
            app/build/reports/native-recording-restart-launcher/
            app/build/reports/native-recording-stop-restart/
            app/build/reports/native-recording-stop-ui-restart/
            app/build/reports/native-recording-send-ui-restart/
          if-no-files-found: warn
          retention-days: 7

  recording-call-emulator:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: capture
            api-level: 35
          - suite: session
            api-level: 35
          - suite: codecs
            api-level: 33
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download exact recording APK inputs from verify
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: signing-lineage-apks
          path: app/build/outputs/apk
      - name: Install recording report tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Qualify full capture and live native/browser Session warnings
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SERIAL: emulator-5554
          KITHMOOT_RECORDING_SUITE: ${{ matrix.suite }}
          KITHMOOT_RECORDING_REPORTS: app/build/reports/native-recording-${{ matrix.suite }}
          KITHMOOT_RECORDING_AVD: kithmoot-recording-${{ matrix.suite }}
        with:
          avd-name: kithmoot-recording-${{ matrix.suite }}
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/check-recording-call-suite-emulator.sh
      - name: Keep full capture and Session interoperability reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: recording-call-emulator-reports-${{ matrix.suite }}
          path: app/build/reports/native-recording-${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 7

  recording-private-node-emulator:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [google_apis, default]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out the pinned private-node fixture source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: forgesworn/wildbloom-node
          ref: 4474ce194888b039f14cf7001e2eab43305b2c9c
          path: build/wildbloom-node
          persist-credentials: false

      - name: Build the real loopback-only fixture daemon
        working-directory: build/wildbloom-node
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 build --locked --release --jobs 2 -p wildbloomd

      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android build SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Download the exact APK inputs from package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: signing-lineage-apks
          path: app/build/outputs/apk

      - name: Generate short and full-size synthetic MP4 fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ripgrep
          mkdir -p build/recording-private-node app/build/reports/native-recording-private-node
          ffmpeg -nostdin -v error -f lavfi -i 'color=c=red:s=1280x720:r=10:d=3' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart build/recording-private-node/short.mp4
          python3 - <<'PY'
          import hashlib, json, shutil, struct
          from pathlib import Path
          short = Path('build/recording-private-node/short.mp4')
          large = short.with_name('maximum.mp4')
          shutil.copyfile(short, large)
          target = 256 * 1024 * 1024
          padding = target - large.stat().st_size
          if not 8 <= padding < 2**32:
              raise RuntimeError('Synthetic MP4 does not fit the recording limit')
          with large.open('ab') as output:
              output.write(struct.pack('>I4s', padding, b'free'))
              output.truncate(target)
          binary = Path('build/wildbloom-node/target/release/wildbloomd')
          receipt = {'node_source': '4474ce194888b039f14cf7001e2eab43305b2c9c',
                     'system_image_target': '${{ matrix.target }}',
                     'node_binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'physical': False, 'synthetic_track_seconds': 3,
                     'large_plaintext_bytes': large.stat().st_size}
          Path('app/build/reports/native-recording-private-node/fixture.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          ffprobe -v error -show_streams -of json build/recording-private-node/maximum.mp4 > app/build/reports/native-recording-private-node/streams.json
          ffmpeg -nostdin -v error -i build/recording-private-node/maximum.mp4 -map 0:a:0 -map 0:v:0 -f null -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android Upload Send Show and Play against the real private node
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SERIAL: emulator-5554
          KITHMOOT_WILDBLOOM_BINARY: ${{ github.workspace }}/build/wildbloom-node/target/release/wildbloomd
          KITHMOOT_RECORDING_HOST_PROXY: '1'
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          avd-name: kithmoot-recording-private-node
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            KITHMOOT_RECORDING_SAMPLE=build/recording-private-node/short.mp4 KITHMOOT_RECORDING_REPORTS=app/build/reports/native-recording-private-node/https-contract bash scripts/check-recording-upload-send-emulator.sh
            KITHMOOT_RECORDING_SAMPLE=build/recording-private-node/short.mp4 KITHMOOT_RECORDING_REPORTS=app/build/reports/native-recording-private-node/short python3 scripts/check-recording-private-node-emulator.py
            KITHMOOT_RECORDING_SAMPLE=build/recording-private-node/maximum.mp4 KITHMOOT_RECORDING_REPORTS=app/build/reports/native-recording-private-node/maximum python3 scripts/check-recording-private-node-emulator.py
            KITHMOOT_RECORDING_SAMPLE=build/recording-private-node/maximum.mp4 KITHMOOT_RECORDING_PROXY_CHUNK_DELAY=0.08 KITHMOOT_RECORDING_REPORTS=app/build/reports/native-recording-private-node/maximum-slow python3 scripts/check-recording-private-node-emulator.py

      - name: Keep real private-node Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: recording-private-node-emulator-reports-${{ matrix.target }}
          path: app/build/reports/native-recording-private-node/
          if-no-files-found: warn
          retention-days: 7

  signing-lineage-emulator:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android build SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Download the exact APK inputs from package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: signing-lineage-apks
          path: app/build/outputs/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify signing rotation and retained encrypted data
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: kithmoot-signing-lineage-${{ matrix.api-level }}
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/check-signing-lineage-emulator.sh

      - name: Keep signing-lineage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signing-lineage-api-${{ matrix.api-level }}
          path: app/build/reports/signing-lineage-api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 7
