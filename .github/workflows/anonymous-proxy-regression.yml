name: Anonymous proxy regression

on:
  push:
    branches: [test/actual-proxy-recovery, test/orbot-held-connect]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anonymous-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proxy-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Record exact producer input
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
          sha256sum app/src/test/kotlin/dev/forgesworn/kithmoot/relay/OrbotPoolRecoveryTest.kt
      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            gradle.properties
      - name: Install the Android build SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare all three required pinned native bundles
        run: |
          scripts/fetch-link-bridge.sh build/link-ffi-android.zip
          python3 scripts/prepare-link-bridge.py build/link-ffi-android.zip
          scripts/fetch-vmls-ffi.sh build/vmls-ffi-android.zip
          python3 scripts/prepare-vmls-ffi.py build/vmls-ffi-android.zip
          python3 scripts/prepare-mesh-radio.py
      - name: Exercise actual WSS adapter and pool through refusal, watchdog and recovery
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'dev.forgesworn.kithmoot.relay.OrbotPoolRecoveryTest' --max-workers=2 --no-daemon --stacktrace
      - name: Require both exact executed cases with no failures or skips
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('app/build/test-results/testDebugUnitTest/TEST-dev.forgesworn.kithmoot.relay.OrbotPoolRecoveryTest.xml')
          root = ET.parse(p).getroot()
          assert root.attrib['tests'] == '2', root.attrib
          assert root.attrib['failures'] == root.attrib['errors'] == root.attrib['skipped'] == '0', root.attrib
          cases = root.findall('testcase')
          expected = {'wss_pool_recovers_after_504_on_a_fresh_connect_without_restart',
                      'wss_pool_cancels_unanswered_connect_and_recovers_without_restart'}
          assert len(cases) == 2 and {c.attrib['name'] for c in cases} == expected, [c.attrib for c in cases]
          assert all(not list(c) for c in cases), [ET.tostring(c) for c in cases]
          print('PASS: both exact actual-adapter/pool WSS recovery cases; no real Tor or physical acceptance')
          PY
      - name: Keep complete test reports even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: anonymous-proxy-recovery-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
