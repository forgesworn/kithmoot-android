name: Keeper busy completion regression

on:
  push:
    branches: [diagnostic/keeper-busy-completion]
    paths: ['app/src/**', 'app/build.gradle.kts', 'gradle/**', '.github/workflows/keeper-busy-completion.yml']

permissions:
  contents: read

concurrency:
  group: keeper-busy-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Prepare the three pinned native bundles
        run: |
          scripts/fetch-link-bridge.sh build/link-ffi-android.zip
          python3 scripts/prepare-link-bridge.py build/link-ffi-android.zip
          scripts/fetch-vmls-ffi.sh build/vmls-ffi-android.zip
          python3 scripts/prepare-vmls-ffi.py build/vmls-ffi-android.zip
          python3 scripts/prepare-mesh-radio.py
      - name: Compile and run the fatal BUSY caller completion regression in both variants
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'dev.forgesworn.kithmoot.epoch.NativeKeeperControllerTest.receiverRetry_*'
          --tests 'dev.forgesworn.kithmoot.epoch.NativeKeeperReceiverBusyTest'
          --tests 'dev.forgesworn.kithmoot.epoch.NativeKeeperBusyCompletionTest'
          :app:testReleaseUnitTest
          --tests 'dev.forgesworn.kithmoot.epoch.NativeKeeperControllerTest.receiverRetry_*'
          --tests 'dev.forgesworn.kithmoot.epoch.NativeKeeperReceiverBusyTest'
          --tests 'dev.forgesworn.kithmoot.epoch.NativeKeeperBusyCompletionTest'
          --continue --no-build-cache --max-workers=2 --no-daemon --stacktrace
      - name: Retain focused reports even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: keeper-busy-completion-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7
